name: observability-resilient-pipeline

services:
  kafka-permissions:
    image: apache/kafka:4.2.2
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - "chown -R 1000:1000 /tmp/kraft-combined-logs"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    mem_limit: 128m
    restart: "no"
    networks:
      - messaging-network

  kafka:
    image: apache/kafka:4.2.2

    depends_on:
      kafka-permissions:
        condition: service_completed_successfully

    mem_limit: 1g

    ports:
      - "127.0.0.1:9092:9092"

    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_LOG_RETENTION_BYTES: "1073741824"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

    security_opt:
      - no-new-privileges:true

    networks:
      - messaging-network

    volumes:
      - kafka_data:/tmp/kraft-combined-logs

    healthcheck:
      test:
        - CMD-SHELL
        - "KAFKA_HEAP_OPTS='-Xms32m -Xmx128m' /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 40s

  kafka-init:
    image: apache/kafka:4.2.2

    depends_on:
      kafka:
        condition: service_healthy

    environment:
      KAFKA_HEAP_OPTS: "-Xms32m -Xmx128m"

    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic raw-events \
          --partitions 3 \
          --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic raw-events-dlq \
          --partitions 3 \
          --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --describe \
          --topic raw-events

    mem_limit: 256m
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks:
      - messaging-network

  producer:
    build:
      context: ./apps/producer
      dockerfile: Dockerfile

    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: raw-events
      PRODUCER_WAIT_FOR_ACK: "true"
      PRODUCER_ACK_TIMEOUT_SECONDS: "2.0"
      PRODUCER_MAX_CONCURRENT_PRODUCES: "500"

    ports:
      - "127.0.0.1:8000:8000"

    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    networks:
      - messaging-network
      - observability-network

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s

  consumer:
    build:
      context: ./apps/consumer
      dockerfile: Dockerfile

    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: raw-events
      KAFKA_DLQ_TOPIC: raw-events-dlq
      KAFKA_CONSUMER_GROUP: events-processor
      CONSUMER_METRICS_PORT: "8001"
      PROCESSING_MIN_MS: "50"
      PROCESSING_MAX_MS: "200"
      PROCESSING_ERROR_RATE: "0"

    expose:
      - "8001"

    mem_limit: 256m
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    networks:
      - messaging-network
      - observability-network

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0

    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

    command:
      - "--kafka.server=kafka:29092"
      - "--topic.filter=^raw-events$$"
      - "--group.filter=^events-processor$$"

    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    networks:
      - messaging-network
      - observability-network

  prometheus:
    image: prom/prometheus:v3.5.0

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=1GB"

    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus

    ports:
      - "127.0.0.1:9090:9090"

    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - observability-network

  grafana:
    image: grafana/grafana:12.1.0

    depends_on:
      prometheus:
        condition: service_started

    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin_resilient_2026}
      GF_ANALYTICS_REPORTING_ENABLED: "false"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro

    ports:
      - "127.0.0.1:3000:3000"

    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - observability-network

  alertmanager:
    image: prom/alertmanager:v0.28.1

    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--cluster.listen-address="

    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

    ports:
      - "127.0.0.1:9093:9093"

    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    networks:
      - observability-network

volumes:
  kafka_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  messaging-network:
    driver: bridge
  observability-network:
    driver: bridge